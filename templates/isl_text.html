{% extends 'base.html' %}
{% block content %}

<section class="translator-page">

<h1 class="translator-title">ISL Text Translator</h1>

<div class="translator-card">

<textarea 
id="inputText"
placeholder="Enter text to convert into Indian Sign Language...">
</textarea>

<button id="translateBtn" class="translate-btn">
Translate
</button>

<p id="status"></p>

</div>

</section>

<script>

const button = document.getElementById("translateBtn");
const status = document.getElementById("status");

button.addEventListener("click", async () => {

const text = document.getElementById("inputText").value;

if(!text){
status.textContent = "Please enter text.";
return;
}

status.textContent = "Translating...";

try{

const response = await fetch("/Itranslate",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({text:text})
});

const result = await response.json();

if(response.ok){
status.textContent = result.status;
}else{
status.textContent = "Translation failed.";
}

}catch(error){
status.textContent = "Server connection failed.";
}

});

</script>

{% endblock %}
