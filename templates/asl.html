{% extends 'base.html' %}
{% block content %}

<section class="isl-page">

<div class="isl-container">

<!-- LEFT SIDE -->

<div class="isl-left">

<img src="{{ url_for('static', filename='asl-logo.png') }}" class="isl-logo">

<p class="isl-description">
Explore American Sign Language translation using text or speech input.
Choose a mode below to begin.
</p>

<div class="isl-buttons">

<a href="/asl_text" class="isl-btn">TEXT</a>

<a href="/asl_speech" class="isl-btn">SPEECH</a>

</div>

</div>


<!-- RIGHT SIDE -->

<div class="isl-right">


<video id="aslVideo" class="isl-video" autoplay muted playsinline></video>

<div class="alphabet-bar" id="aslAlphabetBar"></div>

</div>

</div>

</section>


<script>

const video = document.getElementById("aslVideo");
const alphabetBar = document.getElementById("aslAlphabetBar");

const letters = "abcdefghijklmnopqrstuvwxyz".split("");

let index = 0;
let referenceMode = true;


/* CREATE ALPHABET BUTTONS */

letters.forEach((letter,i)=>{

const btn = document.createElement("span");

btn.innerText = letter.toUpperCase();

btn.onclick = ()=>{

playLetter(i);

};

alphabetBar.appendChild(btn);

});


/* HIGHLIGHT LETTER */

function highlight(activeIndex){

const buttons = alphabetBar.children;

for(let i=0;i<buttons.length;i++){
buttons[i].classList.remove("active");
}

buttons[activeIndex].classList.add("active");

}


/* REFERENCE LOOP */

function playReference(){

referenceMode = true;

video.src = "/asl_dataset/" + letters[index] + ".mp4";

highlight(index);

video.play();

index++;

if(index >= letters.length){
index = 0;
}

}


/* PLAY SINGLE LETTER */

function playLetter(letterIndex){

referenceMode = false;

video.src = "/asl_dataset/" + letters[letterIndex] + ".mp4";

highlight(letterIndex);

video.play();

}


/* REMOVE GAP AS MUCH AS POSSIBLE */

video.addEventListener("timeupdate",()=>{

if(video.duration - video.currentTime < 0.03){

if(referenceMode){

playReference();

}
else{

referenceMode = true;
playReference();

}

}

});


/* START */

playReference();

</script>

{% endblock %}
