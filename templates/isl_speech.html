{% extends 'base.html' %}
{% block content %}

<section class="translator-page">

<h1 class="translator-title">ISL Speech Translator</h1>

<div class="translator-card">

<p class="speech-note">
Click start to record speech. Click stop when finished.
</p>

<div class="record-controls">

<button id="startBtn" class="record-btn">
Start Recording
</button>

<button id="stopBtn" class="record-btn stop">
Stop Recording
</button>

</div>

<p id="recordStatus"></p>

<p id="speechText"></p>

</div>

</section>

<script>

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const recordStatus = document.getElementById("recordStatus");
const speechText = document.getElementById("speechText");

startBtn.addEventListener("click", async () => {

recordStatus.textContent = "Recording...";

try{

const response = await fetch("/isl_start_recording",{
method:"POST"
});

const result = await response.json();
recordStatus.textContent = result.status;

}catch(error){
recordStatus.textContent = "Could not start recording.";
}

});


stopBtn.addEventListener("click", async () => {

recordStatus.textContent = "Processing...";

try{

const response = await fetch("/isl_stop_recording",{
method:"POST"
});

const result = await response.json();

if(response.ok){
speechText.textContent = "Recognized Speech: " + result.text;
recordStatus.textContent = result.status;
}else{
recordStatus.textContent = "Translation failed.";
}

}catch(error){
recordStatus.textContent = "Server connection failed.";
}

});

</script>

{% endblock %}
