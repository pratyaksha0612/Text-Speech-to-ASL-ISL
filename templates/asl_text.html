{% extends "base.html" %}

{% block content %}

<section class="translator-page">

<h1 class="translator-title">Text → ASL Translator</h1>

<div class="translator-card">

<form id="translateForm">

<textarea 
id="inputText" 
placeholder="Enter text to translate into American Sign Language..."
required
></textarea>

<button type="submit" class="translate-btn">
Translate
</button>

</form>

<p id="status"></p>

</div>

</section>


<script>

const form = document.getElementById("translateForm");
const status = document.getElementById("status");

form.addEventListener("submit", async function(e){

e.preventDefault();

const text = document.getElementById("inputText").value;

status.innerText = "Translating...";

try{

const response = await fetch("/Atranslate",{

method: "POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({ text:text })

});

if(response.ok){

const result = await response.json();

status.innerText = result.status;

}else{

status.innerText = "Translation failed.";

}

}catch(error){

console.error(error);

status.innerText = "Could not connect to server.";

}

});

</script>

{% endblock %}
