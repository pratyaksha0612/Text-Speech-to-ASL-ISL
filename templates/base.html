<script>

const canvas = document.getElementById("starfield");

const ctx = canvas.getContext("2d");


canvas.width = window.innerWidth;

canvas.height = window.innerHeight;


let stars = [];

let numStars = 520;

let speed = 0.5;


for(let i=0;i<numStars;i++){

let angle = Math.random()*Math.PI*2;

let distance = Math.random()*2;


stars.push({

x:Math.cos(angle)*distance,
y:Math.sin(angle)*distance,
z:Math.random()*canvas.width

});

}



function animate(){


let gradient = ctx.createRadialGradient(

canvas.width/2,
canvas.height/2,
0,

canvas.width/2,
canvas.height/2,
canvas.width

);


gradient.addColorStop(0,"#0b1d3a");

gradient.addColorStop(0.7,"#05070f");

gradient.addColorStop(1,"#000000");


ctx.fillStyle=gradient;

ctx.fillRect(0,0,canvas.width,canvas.height);



for(let i=0;i<numStars;i++){


let star=stars[i];


star.z-=speed;


if(star.z<=1){

let angle=Math.random()*Math.PI*2;

star.x=Math.cos(angle);

star.y=Math.sin(angle);

star.z=canvas.width;

}


let k=128/star.z;


let px=canvas.width/2+star.x*k*canvas.width;

let py=canvas.height/2+star.y*k*canvas.width;


let size=(1-star.z/canvas.width)*1.8;


let opacity = 0.3 + Math.random()*0.7;

ctx.fillStyle = "rgba(255,255,255,"+opacity+")";

ctx.fillRect(px,py,size,size);



}


requestAnimationFrame(animate);

}


animate();

</script>
<script>


let lastScroll = 0;

const nav = document.querySelector("nav");


window.addEventListener("scroll", () => {

let currentScroll = window.pageYOffset;


if(currentScroll > lastScroll){

nav.style.transform = "translateY(-100%)";

}
else{

nav.style.transform = "translateY(0)";

}


lastScroll = currentScroll;

});


</script>
<script>

document.querySelectorAll(".faq-item").forEach(item=>{

item.addEventListener("click",()=>{

item.classList.toggle("active")

})

})

</script>
